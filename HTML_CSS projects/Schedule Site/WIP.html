<!DOCTYPE html>
<html>
<head> 
    <title>EZ-Schedule</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
        }
        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: auto;
        }
        .button {
            font: bold 18px Arial;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>2025 Event Calender</h1>
    <div class="container">
        <a href="Jan_&_day/Jan.html" class="button">January</a>
        <a href="Feb_&_day/Feb.html" class="button">February</a>
        <a href="Mar_&_day/Mar.html" class="button">March</a>
        <a href="Apr_&_day/Apr.html" class="button">April</a>
        <a href="May_&_day/May.html" class="button">May</a>
        <a href="Jun_&_day/Jun.html" class="button">June</a>
        <a href="Jul_&_day/Jul.html" class="button">July</a>
        <a href="Aug_&_day/Aug.html" class="button">August</a>
        <a href="Sep_&_day/Sep.html" class="button">September</a>
        <a href="Oct_&_day/Oct.html" class="button">October</a>
        <a href="Nov_&_day/Nov.html" class="button">November</a>
        <a href="Dec_&_day/Dec.html" class="button">December</a>
    </div>
    <footer>
        
    </footer>
</body>
</html>
